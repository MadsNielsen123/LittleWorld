services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "******"
      MARIADB_DATABASE: littleworld
      MARIADB_USER: littleworld
      MARIADB_PASSWORD: "******"
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
